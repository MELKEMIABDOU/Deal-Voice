name: deal-voice

services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"

  ollama:
    image: ollama/ollama:0.12.11
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.12.11
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL_NAME"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - path: ${DEALVOICE_ENV_FILE:-.env.docker}
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_STORAGE_PATH: /data/qdrant-fallback
      PARENT_DOCSTORE_PATH: /data/parent_docstore
      OLLAMA_BASE_URL: ${DEALVOICE_OLLAMA_BASE_URL:-http://ollama:11434}
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:${DEALVOICE_PORT:-8000}:8000"
    volumes:
      - raw-data:/app/data/raw
      - processed-data:/app/data/processed
      - parent-docstore:/data/parent_docstore
      - huggingface-cache:/models/huggingface

volumes:
  qdrant-data:
  ollama-data:
  raw-data:
  processed-data:
  parent-docstore:
  huggingface-cache:
